<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#241F1B">
<title>FleetDesk — Мой кабинет</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   Кабинет водителя. Открывается с телефона по ссылке из бота, поэтому
   всё крупное: пальцем, на ходу, часто на солнце. Тёплая основа вместо
   белой — меньше бликов и меньше усталости глаз.
   ══════════════════════════════════════════════════════════════════ */
:root {
  --bg:     #F6F2ED;
  --card:   #FFFFFF;
  --sunk:   #F1EBE4;
  --border: #E9E1D8;
  --text:   #211D19;
  --soft:   #4B443D;
  --muted:  #877D73;

  --blue:        #4F46E5;
  --blue-light:  #EEEBFF;
  --green:       #2E7D4F;
  --green-light: #E7F4EC;
  --amber:       #B26A08;
  --amber-light: #FCF2E1;
  --red:         #BE3A2F;
  --red-light:   #FBEDEB;

  --shadow: 0 1px 2px rgba(33,29,25,.04), 0 6px 18px -10px rgba(33,29,25,.20);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5;
  padding-bottom: env(safe-area-inset-bottom); -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 580px; margin: 0 auto; padding: 0 16px 48px; }

/* Шапка */
.header {
  background: linear-gradient(160deg, #2E2721 0%, #241F1B 100%);
  color: #FDF6EE; padding: 26px 18px 34px;
  padding-top: calc(26px + env(safe-area-inset-top));
}
.header-inner { max-width: 580px; margin: 0 auto; }
.logo { font-size: 13px; opacity: .6; margin-bottom: 8px; letter-spacing: .04em; }
.hello { font-size: 25px; font-weight: 800; letter-spacing: -.4px; line-height: 1.15; }
.company { font-size: 14px; opacity: .65; margin-top: 5px; }

/* Карточки */
.card {
  background: var(--card); border-radius: 18px; padding: 20px;
  box-shadow: var(--shadow); border: 1px solid var(--border); margin-top: 16px;
}
.wrap > .card:first-child { margin-top: -20px; }
.card-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 14px; }

/* Авто */
.plate {
  display: inline-block; font-size: 22px; font-weight: 800; letter-spacing: .6px;
  background: var(--sunk); border: 1px solid var(--border); border-radius: 11px;
  padding: 8px 16px; margin-bottom: 10px;
}
.car-name { font-size: 18px; font-weight: 700; }
.car-sub { font-size: 14px; color: var(--muted); margin-top: 3px; }

.rows { display: flex; flex-direction: column; gap: 1px; background: var(--border); border-radius: 14px; overflow: hidden; margin-top: 16px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 14px; background: var(--card); padding: 14px 15px; }
.row-label { font-size: 14px; color: var(--muted); }
.row-value { font-size: 15px; font-weight: 650; text-align: right; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 20px; white-space: nowrap; }
.b-ok   { background: var(--green-light); color: var(--green); border: 1px solid #BFE0CB; }
.b-warn { background: var(--amber-light); color: var(--amber); border: 1px solid #EFD9B4; }
.b-bad  { background: var(--red-light);   color: var(--red);   border: 1px solid #F0C7C2; }
.b-gray { background: var(--sunk);        color: var(--muted); border: 1px solid var(--border); }

/* Кнопки */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 15px 20px; border-radius: 999px; font-size: 16px; font-weight: 650;
  border: 1px solid transparent; cursor: pointer; width: 100%; font-family: inherit;
  transition: transform .12s, background .15s, border-color .15s;
}
.btn:active { transform: scale(.985); }
.btn-primary { background: var(--blue); color: #fff; box-shadow: 0 6px 16px -8px rgba(79,70,229,.9); }
.btn-ghost { background: var(--card); color: var(--text); border-color: var(--border); }
.btn:disabled { opacity: .5; }
.btn-row { display: flex; gap: 11px; margin-top: 16px; }

/* Поля */
.field { margin-bottom: 15px; }
.field label { display: block; font-size: 13px; font-weight: 650; color: var(--muted); margin-bottom: 7px; }
.input {
  width: 100%; padding: 14px 15px; border: 1px solid var(--border); border-radius: 13px;
  font-size: 16px; font-family: inherit; color: var(--text); background: var(--card); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input::placeholder { color: #B6ADA3; }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
textarea.input { resize: vertical; min-height: 100px; }

/* Заявки */
.ticket { display: flex; gap: 13px; padding: 15px 0; border-bottom: 1px solid var(--border); }
.ticket:last-child { border-bottom: none; }
.ticket-icon { font-size: 21px; flex-shrink: 0; }
.ticket-title { font-size: 15px; font-weight: 650; margin-bottom: 4px; line-height: 1.4; }
.ticket-meta { font-size: 13px; color: var(--muted); }

/* Служебное */
.center { text-align: center; padding: 70px 20px; color: var(--muted); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(120px);
  bottom: 24px; background: #241F1B; color: #FDF6EE; padding: 14px 22px; border-radius: 999px;
  font-size: 15px; font-weight: 550; z-index: 100; opacity: 0; transition: all .3s; max-width: 90vw; text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(33,29,25,.5); z-index: 90; align-items: flex-end; }
.modal-bg.open { display: flex; }
.sheet {
  background: var(--card); width: 100%; border-radius: 24px 24px 0 0; padding: 8px 20px 24px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom)); max-height: 88vh; overflow-y: auto;
}
/* Полоска-«ручка» вверху шторки: сразу понятно, что её можно закрыть */
.sheet::before {
  content: ''; display: block; width: 40px; height: 4px; border-radius: 4px;
  background: var(--border); margin: 8px auto 18px;
}
.sheet-title { font-size: 19px; font-weight: 750; margin-bottom: 18px; letter-spacing: -.02em; }
</style>
</head>
<body>

<div id="app">
  <div class="center"><div class="spinner"></div>Загружаем ваши данные…</div>
</div>

<div class="modal-bg" id="sheet-bg" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  Кабинет водителя. Вход — по токену из ссылки,
//  которую выдал бот. Ничего вводить не нужно.
// ══════════════════════════════════════════
const API = 'https://fleetdesk-bot-production.up.railway.app';

// Токен держим в адресе после #, чтобы он не попадал в логи сервера
let token = location.hash.slice(1);
if (token) {
  sessionStorage.setItem('fd_driver_token', token);
  history.replaceState(null, '', location.pathname);
} else {
  token = sessionStorage.getItem('fd_driver_token') || '';
}

let data = null;

// ── Утилиты ──
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const fmtDate = (d) => d ? new Date(d).toLocaleDateString('ru-RU') : '—';
const fmtNum  = (n) => (n || n === 0) ? Number(n).toLocaleString('ru-RU') : '—';
const daysLeft = (d) => d ? Math.ceil((new Date(d) - new Date()) / 86400000) : null;

function deadlineBadge(date) {
  const left = daysLeft(date);
  if (left === null) return '<span class="badge b-gray">не указано</span>';
  if (left < 0)  return `<span class="badge b-bad">просрочено</span>`;
  if (left < 30) return `<span class="badge b-warn">${left} дн.</span>`;
  return `<span class="badge b-ok">${fmtDate(date)}</span>`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path, opts = {}) {
  const res = await fetch(API + '/api/driver' + path, {
    method: opts.method || 'GET',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  let json = null;
  try { json = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error((json && json.error) || 'Ошибка сервера');
  return json;
}

// ── Загрузка ──
async function load() {
  if (!token) return renderNoAccess('Откройте кабинет через бота — он пришлёт вашу ссылку.');
  try {
    data = await api('/me');
    render();
  } catch (err) {
    renderNoAccess(err.message);
  }
}

function renderNoAccess(msg) {
  document.getElementById('app').innerHTML = `
    <div class="center">
      <div style="font-size:44px;margin-bottom:14px">🔒</div>
      <div style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px">Нет доступа</div>
      <div style="max-width:300px;margin:0 auto">${esc(msg)}</div>
    </div>`;
}

// ── Экран ──
function render() {
  const { driver: d, vehicle: v, company, tickets } = data;
  const active = tickets.filter(t => t.status !== 'DONE' && t.status !== 'CANCELLED');

  document.getElementById('app').innerHTML = `
    <div class="header"><div class="header-inner">
      <div class="logo">🚗 FleetDesk</div>
      <div class="hello">${esc(d.name)}</div>
      <div class="company">${esc(company.name)}</div>
    </div></div>

    <div class="wrap">
      ${v ? `
        <div class="card">
          <div class="card-title">Мой автомобиль</div>
          <div class="plate">${esc(v.plate)}</div>
          <div class="car-name">${esc([v.brand, v.model].filter(Boolean).join(' ')) || '—'}</div>
          <div class="car-sub">${[v.year, v.color].filter(Boolean).map(esc).join(' · ')}</div>

          <div class="rows">
            <div class="row"><span class="row-label">Пробег</span>
              <span class="row-value">${fmtNum(v.mileage)} км</span></div>
            <div class="row"><span class="row-label">ОСАГО до</span>
              <span class="row-value">${deadlineBadge(v.insurance_until)}</span></div>
            <div class="row"><span class="row-label">Техосмотр до</span>
              <span class="row-value">${deadlineBadge(v.inspection_until)}</span></div>
            <div class="row"><span class="row-label">Следующее ТО</span>
              <span class="row-value">${v.next_service_date ? fmtDate(v.next_service_date) : '—'}${v.next_service_km ? ' · ' + fmtNum(v.next_service_km) + ' км' : ''}</span></div>
            ${v.tires_change_date ? `<div class="row"><span class="row-label">Смена резины</span>
              <span class="row-value">${fmtDate(v.tires_change_date)}</span></div>` : ''}
            ${v.location ? `<div class="row"><span class="row-label">Где находится</span>
              <span class="row-value">${esc(v.location)}</span></div>` : ''}
          </div>

          <div class="btn-row">
            <button class="btn btn-primary" onclick="openMileage()">📊 Внести пробег</button>
          </div>
        </div>
      ` : `
        <div class="card">
          <div class="card-title">Мой автомобиль</div>
          <div style="color:var(--muted);font-size:14px">
            За вами пока не закреплён автомобиль. Обратитесь к диспетчеру.
          </div>
        </div>
      `}

      <div class="card">
        <div class="card-title">Мои документы</div>
        <div class="rows">
          <div class="row"><span class="row-label">Водительское удостоверение</span>
            <span class="row-value">${deadlineBadge(d.license_expires)}</span></div>
          <div class="row"><span class="row-label">Медицинская справка</span>
            <span class="row-value">${deadlineBadge(d.medical_expires)}</span></div>
          ${d.license_number ? `<div class="row"><span class="row-label">Номер ВУ</span>
            <span class="row-value">${esc(d.license_number)}</span></div>` : ''}
          ${d.license_category ? `<div class="row"><span class="row-label">Категории</span>
            <span class="row-value">${esc(d.license_category)}</span></div>` : ''}
          ${d.briefing_date ? `<div class="row"><span class="row-label">Инструктаж</span>
            <span class="row-value">${fmtDate(d.briefing_date)}</span></div>` : ''}
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="openProfile()">✏️ Изменить данные</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Мои заявки${active.length ? ` · ${active.length} в работе` : ''}</div>
        ${tickets.length === 0
          ? `<div style="color:var(--muted);font-size:14px">Заявок пока нет</div>`
          : tickets.slice(0, 10).map(t => renderTicket(t)).join('')}
        <div class="btn-row">
          <button class="btn btn-primary" onclick="openNewTicket()">📝 Новая заявка</button>
        </div>
      </div>

      <div style="text-align:center;margin-top:22px;font-size:12px;color:var(--muted)">
        Данные обновляются автоматически.<br>Вопросы — вашему диспетчеру.
      </div>
    </div>
  `;
}

const STATUS = {
  NEW:         { label: 'Новая',      cls: 'b-warn' },
  IN_PROGRESS: { label: 'В работе',   cls: 'b-ok'   },
  WAITING:     { label: 'Ожидание',   cls: 'b-gray' },
  DONE:        { label: 'Выполнено',  cls: 'b-ok'   },
  CANCELLED:   { label: 'Отменена',   cls: 'b-gray' },
};

function renderTicket(t) {
  const st = STATUS[t.status] || { label: t.status, cls: 'b-gray' };
  return `
    <div class="ticket">
      <div class="ticket-icon">${esc(t.type_icon)}</div>
      <div style="flex:1;min-width:0">
        <div class="ticket-title">${esc(t.title || t.type_name)}</div>
        <div class="ticket-meta">
          ${esc(t.num)} · ${new Date(t.created_at).toLocaleDateString('ru-RU')}
          ${t.contractor_name ? ` · 🔧 ${esc(t.contractor_name)}` : ''}
        </div>
      </div>
      <span class="badge ${st.cls}" style="align-self:flex-start">${st.label}</span>
    </div>`;
}

// ── Нижние окна ──
function openSheet(html) {
  document.getElementById('sheet').innerHTML = html;
  document.getElementById('sheet-bg').classList.add('open');
}
function closeSheet() {
  document.getElementById('sheet-bg').classList.remove('open');
}

function openMileage() {
  const v = data.vehicle;
  openSheet(`
    <div class="sheet-title">Внести пробег</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:14px">
      Текущий в системе: <strong>${fmtNum(v.mileage)} км</strong>
    </div>
    <div class="field">
      <label>Пробег на одометре, км</label>
      <input class="input" id="mileage-input" type="number" inputmode="numeric"
             placeholder="${v.mileage || 0}" value="">
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeSheet()">Отмена</button>
      <button class="btn btn-primary" id="mileage-save" onclick="saveMileage()">Сохранить</button>
    </div>
  `);
  setTimeout(() => document.getElementById('mileage-input').focus(), 250);
}

async function saveMileage() {
  const value = document.getElementById('mileage-input').value;
  const btn = document.getElementById('mileage-save');
  btn.disabled = true; btn.textContent = 'Сохраняем…';
  try {
    const res = await api('/mileage', { method: 'POST', body: { mileage: value } });
    data.vehicle.mileage = res.mileage;
    closeSheet(); render();
    showToast('✅ Пробег обновлён');
  } catch (err) {
    showToast('❌ ' + err.message);
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
}

function openProfile() {
  const d = data.driver;
  openSheet(`
    <div class="sheet-title">Мои данные</div>
    <div class="field"><label>Телефон</label>
      <input class="input" id="p-phone" type="tel" value="${esc(d.phone)}"></div>
    <div class="field"><label>E-mail</label>
      <input class="input" id="p-email" type="email" value="${esc(d.email)}"></div>
    <div class="field"><label>Номер водительского удостоверения</label>
      <input class="input" id="p-licnum" value="${esc(d.license_number)}"></div>
    <div class="field"><label>Категории</label>
      <input class="input" id="p-liccat" value="${esc(d.license_category)}" placeholder="B, C"></div>
    <div class="field"><label>ВУ действует до</label>
      <input class="input" id="p-licexp" type="date" value="${d.license_expires || ''}"></div>
    <div class="field"><label>Медсправка до</label>
      <input class="input" id="p-medexp" type="date" value="${d.medical_expires || ''}"></div>
    <div class="field"><label>Топливная карта</label>
      <input class="input" id="p-fuel" value="${esc(d.fuel_card)}"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeSheet()">Отмена</button>
      <button class="btn btn-primary" id="p-save" onclick="saveProfile()">Сохранить</button>
    </div>
  `);
}

async function saveProfile() {
  const btn = document.getElementById('p-save');
  btn.disabled = true; btn.textContent = 'Сохраняем…';
  const body = {
    phone:            document.getElementById('p-phone').value,
    email:            document.getElementById('p-email').value,
    license_number:   document.getElementById('p-licnum').value,
    license_category: document.getElementById('p-liccat').value,
    license_expires:  document.getElementById('p-licexp').value,
    medical_expires:  document.getElementById('p-medexp').value,
    fuel_card:        document.getElementById('p-fuel').value,
  };
  try {
    await api('/profile', { method: 'PATCH', body });
    Object.assign(data.driver, body);
    closeSheet(); render();
    showToast('✅ Данные сохранены');
  } catch (err) {
    showToast('❌ ' + err.message);
    btn.disabled = false; btn.textContent = 'Сохранить';
  }
}

function openNewTicket() {
  const options = data.ticketTypes
    .map(t => `<option value="${esc(t.key)}">${esc(t.icon)} ${esc(t.name)}</option>`).join('');
  openSheet(`
    <div class="sheet-title">Новая заявка</div>
    <div class="field"><label>Тип</label>
      <select class="input" id="t-type">${options}</select></div>
    <div class="field"><label>Коротко о проблеме</label>
      <input class="input" id="t-title" placeholder="Не заводится, стучит подвеска…"></div>
    <div class="field"><label>Подробности</label>
      <textarea class="input" id="t-desc" placeholder="Когда началось, что уже проверяли"></textarea></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeSheet()">Отмена</button>
      <button class="btn btn-primary" id="t-save" onclick="saveTicket()">Отправить</button>
    </div>
  `);
}

async function saveTicket() {
  const title = document.getElementById('t-title').value.trim();
  if (!title) { showToast('⚠️ Опишите проблему'); return; }
  const btn = document.getElementById('t-save');
  btn.disabled = true; btn.textContent = 'Отправляем…';
  try {
    const res = await api('/tickets', { method: 'POST', body: {
      type: document.getElementById('t-type').value,
      title,
      description: document.getElementById('t-desc').value,
    }});
    closeSheet();
    showToast(`✅ Заявка ${res.num} создана`);
    data = await api('/me');
    render();
  } catch (err) {
    showToast('❌ ' + err.message);
    btn.disabled = false; btn.textContent = 'Отправить';
  }
}

load();
</script>
</body>
</html>
