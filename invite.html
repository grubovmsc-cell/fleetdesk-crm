<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FleetDesk — Приглашение</title>
<style>
:root {
  --bg: #f1f5f9; --card: #fff; --border: #e2e8f0;
  --text: #0f172a; --muted: #64748b; --blue: #3b82f6;
  --red: #ef4444; --red-light: #fef2f2; --green-light: #f0fdf4;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; color: var(--text);
}
.card { background: #fff; border-radius: 16px; width: 420px; max-width: 100%; overflow: hidden; box-shadow: 0 24px 80px rgba(0,0,0,.4); }
.head { background: linear-gradient(135deg,#0f172a,#1e40af); color: #fff; padding: 30px 32px 26px; text-align: center; }
.logo { font-size: 26px; font-weight: 800; letter-spacing: -.5px; margin-bottom: 4px; }
.tagline { font-size: 13px; color: #93c5fd; }
.body { padding: 28px 32px 32px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .05em; }
.input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 9px; font-size: 15px; outline: none; font-family: inherit; color: var(--text); }
.input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
.btn { width: 100%; padding: 13px; background: var(--blue); color: #fff; border: none; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn:hover { background: #2563eb; }
.btn:disabled { opacity: .6; }
.err { background: var(--red-light); border: 1px solid #fca5a5; color: #b91c1c; border-radius: 9px; padding: 11px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
.err.show { display: block; }
.info { background: var(--green-light); border: 1px solid #bbf7d0; border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; font-size: 13px; color: #166534; line-height: 1.6; }
.center { text-align: center; padding: 40px 20px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>

<div class="card">
  <div class="head">
    <div class="logo">🚗 FleetDesk</div>
    <div class="tagline">Система управления корпоративным автопарком</div>
  </div>
  <div class="body" id="body">
    <div class="center">Проверяем приглашение…</div>
  </div>
</div>

<script>
const API = 'https://fleetdesk-bot-production.up.railway.app/api';

// Токен передан после # — не попадает в логи сервера
const token = location.hash.slice(1);

const ROLE_NAMES = {
  owner: 'Владелец', admin: 'Администратор',
  dispatcher: 'Диспетчер', viewer: 'Наблюдатель',
};

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function fail(msg) {
  document.getElementById('body').innerHTML = `
    <div class="center">
      <div style="font-size:40px;margin-bottom:14px">🔗</div>
      <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px">Ссылка не подошла</div>
      <div>${esc(msg)}</div>
      <div class="hint" style="margin-top:14px">Попросите администратора прислать новое приглашение.</div>
    </div>`;
}

async function check() {
  if (!token) return fail('В ссылке нет кода приглашения.');
  try {
    const res = await fetch(`${API}/auth/invite/${token}`);
    const data = await res.json();
    if (!res.ok) return fail(data.error || 'Приглашение недействительно.');
    render(data);
  } catch (err) {
    fail('Не удалось связаться с сервером. Проверьте интернет и обновите страницу.');
  }
}

function render(inv) {
  document.getElementById('body').innerHTML = `
    <div class="info">
      <strong>${esc(inv.name)}</strong>, вас пригласили в компанию
      «<strong>${esc(inv.company_name)}</strong>» с ролью
      «${esc(ROLE_NAMES[inv.role] || inv.role)}».<br>
      Придумайте пароль для входа — логином будет ${esc(inv.email)}.
    </div>

    <div class="err" id="err"></div>

    <div class="field">
      <label>Пароль</label>
      <input class="input" id="pass" type="password" autocomplete="new-password" placeholder="Минимум 6 символов">
    </div>
    <div class="field">
      <label>Повторите пароль</label>
      <input class="input" id="pass2" type="password" autocomplete="new-password"
             onkeydown="if(event.key==='Enter')submit()">
    </div>
    <button class="btn" id="btn" onclick="submit()">Войти в FleetDesk →</button>
    <div class="hint">После этого вы сразу попадёте в систему.</div>`;
  document.getElementById('pass').focus();
}

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.classList.add('show');
}

async function submit() {
  const p1 = document.getElementById('pass').value;
  const p2 = document.getElementById('pass2').value;
  const btn = document.getElementById('btn');

  if (p1.length < 6) return showErr('Пароль минимум 6 символов');
  if (p1 !== p2)     return showErr('Пароли не совпадают');

  document.getElementById('err').classList.remove('show');
  btn.disabled = true; btn.textContent = 'Создаём аккаунт…';

  try {
    const res = await fetch(`${API}/auth/invite/${token}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: p1 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Не удалось активировать аккаунт');

    // Кладём сессию туда же, где её ищет CRM — и сразу открываем её
    localStorage.setItem('fleetdesk_token', data.token);
    location.href = '/';
  } catch (err) {
    showErr(err.message);
    btn.disabled = false; btn.textContent = 'Войти в FleetDesk →';
  }
}

check();
</script>
</body>
</html>
